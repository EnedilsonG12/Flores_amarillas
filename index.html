<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLORES AMARILLAS </title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 2s ease, visibility 2s ease;
      overflow: hidden;
      padding: 10px;
      box-sizing: border-box;
    }

    .intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .neon-title {
      font-family: 'Great Vibes', cursive;
      font-size: 5rem;
      text-align: center;
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ffeb3b,
        0 0 40px #ffeb3b,
        0 0 80px #ffeb3b,
        0 0 90px #ffeb3b,
        0 0 100px #ffeb3b,
        0 0 150px #ffeb3b;
      animation: neon-flicker 2s infinite alternate;
      margin-bottom: 15px;
      padding: 0 10px;
      line-height: 1.1;
    }

    @keyframes neon-flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #ffeb3b,
          0 0 40px #ffeb3b,
          0 0 80px #ffeb3b,
          0 0 90px #ffeb3b,
          0 0 100px #ffeb3b,
          0 0 150px #ffeb3b;
      }
      20%, 24%, 55% {
        text-shadow: none;
      }
    }

    .dedication {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #ffd700;
      text-align: center;
      max-width: 600px;
      margin: 10px auto;
      padding: 10px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.7), 0 0 30px rgba(255, 215, 0, 0.5);
      line-height: 1.5;
    }

    .gift-button {
      margin-top: 25px;
      padding: 15px 40px;
      font-size: 1.5rem;
      font-family: 'Playfair Display', serif;
      background: linear-gradient(45deg, #ffeb3b, #ffc107);
      border: none;
      border-radius: 50px;
      color: #1a1a2e;
      cursor: pointer;
      box-shadow:
        0 0 20px rgba(255, 235, 59, 0.5),
        0 0 40px rgba(255, 235, 59, 0.3),
        0 0 60px rgba(255, 235, 59, 0.2);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .gift-button:hover {
      transform: scale(1.1);
      box-shadow:
        0 0 30px rgba(255, 235, 59, 0.7),
        0 0 60px rgba(255, 235, 59, 0.5),
        0 0 90px rgba(255, 235, 59, 0.3);
    }

    .music-button {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ffeb3b, #ffc107);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow:
        0 0 15px rgba(255, 235, 59, 0.5),
        0 0 30px rgba(255, 235, 59, 0.3);
      transition: all 0.3s ease;
    }

    .music-button:hover {
      transform: scale(1.1);
      box-shadow:
        0 0 20px rgba(255, 235, 59, 0.7),
        0 0 40px rgba(255, 235, 59, 0.5);
    }

    .music-button.playing {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
      box-shadow: 0 0 5px white, 0 0 10px white;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #ffeb3b, #ffc107);
      border-radius: 50%;
      box-shadow: 0 0 15px #ffeb3b, 0 0 30px #ffc107, 0 0 45px #ffeb3b;
      animation: float-particle 8s infinite ease-in-out;
    }

    @keyframes float-particle {
      0%, 100% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: 0.8;
      }
      25% {
        transform: translateY(-100px) translateX(50px) scale(1.5);
        opacity: 1;
      }
      50% {
        transform: translateY(-200px) translateX(-30px) scale(1);
        opacity: 0.6;
      }
      75% {
        transform: translateY(-100px) translateX(-50px) scale(1.3);
        opacity: 0.9;
      }
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 20px white, 0 0 40px #ffeb3b, 0 0 60px #ffc107;
      animation: sparkle 2s infinite;
    }

    @keyframes sparkle {
      0%, 100% {
        transform: scale(0) rotate(0deg);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.2) rotate(180deg);
        opacity: 1;
      }
    }

    .glow-ring {
      position: absolute;
      border: 2px solid rgba(255, 235, 59, 0.3);
      border-radius: 50%;
      animation: expand-ring 4s infinite;
    }

    @keyframes expand-ring {
      0% {
        transform: scale(0.5);
        opacity: 1;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    .floating-light {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, rgba(255, 235, 59, 0.8), transparent);
      border-radius: 50%;
      filter: blur(10px);
      animation: float-light 6s infinite ease-in-out;
    }

    @keyframes float-light {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0.3;
      }
      50% {
        transform: translate(100px, -50px);
        opacity: 0.8;
      }
    }

    .heart-particle {
      position: absolute;
      font-size: 28px;
      animation: float-heart 6s infinite ease-in-out;
      filter: drop-shadow(0 0 15px currentColor) drop-shadow(0 0 30px currentColor);
    }

    @keyframes float-heart {
      0% {
        transform: translateY(100vh) translateX(0) scale(1);
        opacity: 0.5;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(0) scale(1);
        opacity: 0.5;
      }
    }

    .heart-red { color: #ff0000; text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000; }
    .heart-pink { color: #ff69b4; text-shadow: 0 0 30px #ff69b4, 0 0 60px #ff69b4, 0 0 90px #ff69b4; }
    .heart-purple { color: #9b59b6; text-shadow: 0 0 30px #9b59b6, 0 0 60px #9b59b6, 0 0 90px #9b59b6; }
    .heart-gold { color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700, 0 0 90px #ffd700; }
    .heart-blue { color: #3498db; text-shadow: 0 0 30px #3498db, 0 0 60px #3498db, 0 0 90px #3498db; }

    /* Responsive Design */
    @media (max-width: 768px) {
      .neon-title {
        font-size: 2.5rem;
        padding: 0 10px;
      }

      .dedication {

        padding: 15px;
        max-width: 90%;
      }

        font-size: 1.2rem;
        margin-top: 30px;
      }

      .music-button {

        height: 40px;
        font-size: 20px;
        top: 15px;
        right: 15px;
      }

      .heart-particle {

      }
    }

    @media (max-width: 480px) {

        padding: 0 5px;
      }

      .dedication {
        font-size: 1rem;
        padding: 10px;
        max-width: 95%;
      }

        height: 35px;
        font-size: 18px;
        top: 10px;
        right: 10px;
      }

      .heart-particle {

      }
    }

    @media (min-width: 1200px) {
      .neon-title {

      }

      .dedication {
        font-size: 2.5rem;
      }

      .gift-button {
        padding: 25px 60px;
        font-size: 1.8rem;
      }
    }
  </style>

</head>
